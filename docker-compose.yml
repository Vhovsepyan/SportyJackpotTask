# Optional tooling for the `kafka` profile ONLY.
# The default `mock` profile needs none of this — it runs with just a JDK.
#
#   docker compose up -d
#   ./gradlew bootRun --args='--spring.profiles.active=kafka'
#
# Single-node Kafka in KRaft mode (no ZooKeeper).
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: jackpot-kafka
    ports:
      - "9092:9092"
    environment:
      # --- KRaft (no ZooKeeper): this node is both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Broker listener binds all interfaces (reachable from the host); the
      # controller listener binds localhost. In combined broker+controller KRaft
      # mode the controller listener is not advertised, so Kafka derives its
      # advertised address from `listeners` — binding it to 0.0.0.0 there trips
      # the "advertised.listeners cannot use the meta-address 0.0.0.0" check.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

